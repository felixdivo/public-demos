<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>demo.divo.link</title>
<meta name="description" content="Small interactive demos.">
<link rel="stylesheet" href="assets/site.css">
<style>
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:22px}
li p{margin:2px 0 0}
</style>
</head>
<body>
<main>
  <h1>demo.divo.link</h1>
  <ul id="list">
    <noscript><li><a href="orbitals/">Orbital Explorer</a><p class="muted">Atomic, hybrid and molecular orbitals in 3D.</p></li></noscript>
  </ul>
</main>
<script src="demos.js"></script>
<script>
document.getElementById('list').innerHTML = (window.DEMOS || []).map(d =>
  `<li><a href="${d.path}">${d.title}</a>${d.description ? `<p class="muted">${d.description}</p>` : ''}</li>`).join('');
</script>
</body>
</html>
