:root{
  /* Layout: one narrow column of demo entries on near-black */
  --bg:#0b0c0e; --ink:#ececec; --muted:#8b9096; --line:rgba(236,236,236,.10); --accent:#ffe45c; --blue:#58c4dd;
  --serif:"CMU Serif","Latin Modern Roman",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 19px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:72px 20px 96px}
h1{font:italic 400 56px/1 var(--serif);margin:0 0 12px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 48px}
ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a.demo{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;padding:22px 0;color:inherit;text-decoration:none}
.n{grid-row:span 2;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.t{font-size:24px;transition:color .2s}
.d{color:var(--muted);font-size:17px}
a.demo:hover .t,a.demo:focus-visible .t{color:var(--accent)}
a.demo:focus-visible{outline:1px solid var(--accent);outline-offset:4px}
footer{margin-top:48px;color:var(--muted);font-size:15px}
@media (max-width:420px){ main{padding-top:48px} h1{font-size:44px} }
</style>
</head>
<body>
<main>
  <h1>Demos</h1>
  <p class="lede">Small interactive pieces for seeing how things work.</p>
  <ol>
    <li><a class="demo" href="orbitals/">
      <span class="n">01</span>
      <span class="t">Orbital Explorer</span>
      <span class="d">Atomic, hybrid and molecular orbitals in 3D, from 1s to 4f, sp to sp³d², H<sub>2</sub> to benzene.</span>
    </a></li>
  </ol>
  <footer>divo.link</footer>
</main>
</body>
</html>
